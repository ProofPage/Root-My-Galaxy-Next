name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias rootmygalaxy -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=RootMyGalaxyNext, O=ProofPage, C=KR"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=rootmygalaxy" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Stage APKs
        run: |
          mkdir -p release-apks
          VERSION_NAME="$(grep -oE 'appVersionBase[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          cp app/build/outputs/apk/release/*.apk "release-apks/RootMyGalaxyNext-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/*.apk "release-apks/RootMyGalaxyNext-${VERSION_NAME}-debug.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RootMyGalaxyNext-apks
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(grep -oE 'appVersionBase[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          TAG="v${VERSION_NAME}"
          gh release upload "$TAG" release-apks/*.apk --clobber || gh release create "$TAG" release-apks/*.apk --title "Release $TAG" --notes "Release $TAG (Debug & Release builds)"

